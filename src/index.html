<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marco Restaurant</title>
</head>
<body>
    <!--
      The shell. Only three parts live here: the header, an empty #content div,
      and the footer. Everything else is injected into #content by JavaScript,
      so the header and footer never re-render when you switch views.
    -->
    <header>
        <div class="logo">
            <img src="./logo_restaurant.png" alt="Venezuelan flag">
            <p>Marco</p>
        </div>
        <nav>
            <button id="home-btn">Home</button>
            <button id="menu-btn">Menu</button>
            <button id="about-btn">About</button>
            <button id="contact-btn">Contact</button>
        </nav>
    </header>

    <!-- Views get swapped in here. Empty on purpose. -->
    <div id="content"></div>

    <footer>
        <div class="wrap row-between">
            <span class="footer-brand">
                <img src="./logo_restaurant.png" alt="">
                Marco
            </span>
            <span class="footer-address">1847 Palmetto Bay Drive, Miami, FL 33157</span>
        </div>
    </footer>
</body>
</html>
